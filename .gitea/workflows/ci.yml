on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: dictation
    env:
      GIT_SSL_NO_VERIFY: "true"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages -e .[dev]
      - run: python3 -m pytest tests/ -v

  security-audit:
    runs-on: dictation
    env:
      GIT_SSL_NO_VERIFY: "true"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages pip-audit
      - run: pip-audit -r pyproject.toml --skip-editable
