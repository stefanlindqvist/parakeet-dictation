[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-dictation"
version = "0.0.0"
description = "Local push-to-talk speech-to-text dictation daemon using Parakeet-TDT 0.6B v3 via ONNX Runtime DirectML on Windows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Stefan" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "onnx-asr>=0.3.0",
    "onnxruntime-directml>=1.19.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26,<2.2",
    "silero-vad>=5.1.2",
    "pynput>=1.7.7",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
parakeet-dictation = "parakeet_dictation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
